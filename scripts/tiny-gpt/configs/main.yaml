# Main run, sized from the pilot measurements (see experiments/ for the plan).
run_id: main
data_dir: data/prepared-char
out_dir: artifacts/runs
seed: 1337

block_size: 256
n_layer: 4
n_head: 4
n_embd: 256
dropout: 0.15
tie_embeddings: true

batch_size: 16
grad_accum: 2        # 8,192 tokens per optimizer update
learning_rate: 1.0e-3
min_lr_frac: 0.1
weight_decay: 0.1
beta1: 0.9
beta2: 0.99
grad_clip: 1.0
warmup_steps: 100
max_steps: 1200

eval_every: 100
eval_tokens: 131072
log_every: 50
sample_every: 400
sample_tokens: 200
save_every: 300
threads: 2
