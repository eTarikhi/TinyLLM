# Does more data help? The question four sweeps could not answer.
#
# Steps, model size, context length and peak learning rate have all been swept
# at this budget and none of them binds: more steps buys 0.0098 bpb over four
# evaluations, 2.11x the parameters buys a tie, more context actively hurts,
# and the inherited learning rate is already within 1.3x of the best in a
# half-decade bracket. The configuration the eight-minute pilots chose sits at
# a local optimum that roughly six hours of compute cannot escape.
#
# The one thing never varied is the corpus. 18.8 MB, and the released run has
# already read it 6.81 times. This run reads a 3.53x larger training split --
# 71 books instead of 27, 20,379,728 tokens instead of 5,771,560 -- at exactly
# the same compute, so it makes 1.93 passes instead of 6.81.
#
# The comparison is airtight by construction. The 44 added books are marked
# `train_only` in src/data.py, so validation and test are *byte-identical* to
# `gutenberg-mixed-27` -- verified by `cmp` on val.bin and test.bin -- and the
# byte-BPE vocabulary is identical too, because the tokenizer sample excludes
# train-only text. Against `main-gutenberg-4800.yaml` the only effective
# differences are `run_id` and `data_dir`: same architecture, same seed, same
# schedule, same 39,321,600 tokens, scored on the same held-out bytes.
#
# A real improvement here says the model was data-limited all along and every
# sweep was measuring the wrong axis. No improvement says 18.8 MB of 19th
# century prose already saturates a 1.77M-parameter model, and the ceiling is
# the model, not the corpus.
run_id: data-gb71
data_dir: data/prepared-gb71-bpe2048
out_dir: artifacts/runs
seed: 1337

block_size: 256
n_layer: 3
n_head: 3
n_embd: 192
dropout: 0.0
tie_embeddings: true

batch_size: 16
grad_accum: 2        # 8,192 tokens per optimizer update
learning_rate: 3.0e-3
min_lr_frac: 0.1
weight_decay: 0.1
beta1: 0.9
beta2: 0.99
grad_clip: 1.0
warmup_steps: 240
max_steps: 4800

eval_every: 120      # 40 evaluations, directly comparable step-for-step
eval_tokens: 98304   # the same fixed 31% slice of the val split
log_every: 50
sample_every: 1200
sample_tokens: 240
save_every: 800
max_seconds: 5400
threads: 2
