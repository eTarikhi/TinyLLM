# Seed bar for the released configuration (third of three draws).
#
# Every number in this directory is a single draw. Two of the conclusions now
# rest on margins a seed could plausibly produce on its own: the size sweep's
# 0.2% and the learning-rate bracket's 0.08%. Both were reported as ties for
# that reason, but "probably a tie" is an assertion, not a measurement.
#
# This run and `seed-1339.yaml` repeat `main-gutenberg-4800.yaml` verbatim
# with only the seed changed, which changes weight initialisation and batch
# order and nothing else. Three draws is a small sample, but the spread of
# three is enough to say whether 0.2% is inside it -- and that single fact
# re-reads every table in this directory.
run_id: seed-1339
data_dir: data/prepared-gb-bpe2048
out_dir: artifacts/runs
seed: 1339

block_size: 256
n_layer: 3
n_head: 3
n_embd: 192
dropout: 0.0
tie_embeddings: true

batch_size: 16
grad_accum: 2        # 8,192 tokens per optimizer update
learning_rate: 3.0e-3
min_lr_frac: 0.1
weight_decay: 0.1
beta1: 0.9
beta2: 0.99
grad_clip: 1.0
warmup_steps: 240
max_steps: 4800

eval_every: 120      # 40 evaluations, directly comparable step-for-step
eval_tokens: 98304   # the same fixed 31% slice of the val split
log_every: 50
sample_every: 1200
sample_tokens: 240
save_every: 800
max_seconds: 5400
threads: 2
