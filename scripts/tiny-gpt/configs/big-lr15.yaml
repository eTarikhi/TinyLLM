# LR probe at 3.74M: is 3e-3 still right at 2x width?
#
#   The 3e-3 peak was bracketed at 1.77M parameters on 27 books. Wider
#   models usually want a lower peak (the muP intuition), and every big
#   run since has inherited 3e-3 untested. Short clock (2,571 steps)
#   against broad-4L256d-full's 1.6467; seed 1337 so only LR moves.
run_id: big-lr15
data_dir: data/prepared-broad-full
out_dir: artifacts/runs
seed: 1337

block_size: 256
n_layer: 4
n_head: 4
n_embd: 256
dropout: 0.0
tie_embeddings: true

batch_size: 16
grad_accum: 2
learning_rate: 1.5e-3
min_lr_frac: 0.1
weight_decay: 0.1
beta1: 0.9
beta2: 0.99
grad_clip: 1.0
warmup_steps: 129
max_steps: 2571

eval_every: 128
eval_tokens: 98304
eval_spread: true
log_every: 50
sample_every: 1200
sample_tokens: 240
save_every: 800
max_seconds: 7200
threads: 2
