# Data scaling, control arm: train on 27 of the 71 books.
#
# The clean restatement of "does more data help?".
#
#   `data-gb71` asked it with the evaluation held fixed on the original 27
#   books and got a negative answer: 3.53x the training text cost +0.53% test
#   bits per byte. The probe in `distribution-shift.json` explains why -- a
#   27-book model finds the 44 additions 6.93% harder than its own test split,
#   so they are a different distribution competing for a 1.77M-parameter
#   budget, not more of the same.
#
#   That leaves the general question open, and these two runs ask it. Both are
#   evaluated on val and test slices drawn from all 71 books, byte-identical
#   between the two prepared corpora (`cmp`-verified) and tokenized with a
#   shared vocabulary via `--tokenizer-from`. The only difference is how many
#   documents feed the training split:
#
#     data71-full  18,939,699 train tokens   2.08 epochs   all 71 books
#     data71-ctrl   5,771,560 train tokens   6.81 epochs   the original 27
#
#   Same horizon, same schedule, same seed, same 40-point evaluation grid, so
#   step-for-step comparison is valid. If `full` wins, the earlier negative
#   result was about evaluation coverage rather than about data.
#
#   `eval_spread: true` is new and necessary here. The capped in-training
#   evaluation slice is a *prefix* of the split, and these splits concatenate
#   71 documents in order, so 98,304 of 1,042,315 val tokens would have
#   covered only the first few books -- exactly the subset this experiment is
#   trying to stop privileging. Spreading the windows evenly keeps the cost
#   and covers all 71. It also means the val numbers here are NOT comparable
#   with any previously published val number; the test-split figures from
#   `evaluate.py`, which always covered the whole split, are.
run_id: data71-ctrl
data_dir: data/prepared-71-ctrl
out_dir: artifacts/runs
seed: 1337

block_size: 256
n_layer: 3
n_head: 3
n_embd: 192
dropout: 0.0
tie_embeddings: true

batch_size: 16
grad_accum: 2        # 8,192 tokens per optimizer update
learning_rate: 3.0e-3
min_lr_frac: 0.1
weight_decay: 0.1
beta1: 0.9
beta2: 0.99
grad_clip: 1.0
warmup_steps: 240    # held fixed, not scaled with the horizon
max_steps: 4800      # 2x the 2400-step run; cosine horizon equals run length

eval_every: 120      # 40 evaluations, directly comparable step-for-step
eval_tokens: 98304   # 9.4% of the 1,042,315-token val split
eval_spread: true    # spread over all 71 books, not the leading few
log_every: 50
sample_every: 1200
sample_tokens: 240
save_every: 800
max_seconds: 6000    # guard: 100 min; the larger splits make evaluation slower
threads: 2
