# LR probe, other direction: 6e-3 at 3.74M on the short clock.
#
#   big-lr15 settled that halving the peak is bad (+2.26%). At 1.77M,
#   6e-3 tied 3e-3 within seed noise, so the optimum at this size and
#   horizon could sit at or above 3e-3. One arm decides the peak LR
#   for the long release run. Against broad-4L256d-full's 1.6467.
run_id: big-lr60
data_dir: data/prepared-broad-full
out_dir: artifacts/runs
seed: 1337

block_size: 256
n_layer: 4
n_head: 4
n_embd: 256
dropout: 0.0
tie_embeddings: true

batch_size: 16
grad_accum: 2
learning_rate: 6.0e-3
min_lr_frac: 0.1
weight_decay: 0.1
beta1: 0.9
beta2: 0.99
grad_clip: 1.0
warmup_steps: 129
max_steps: 2571

eval_every: 128
eval_tokens: 98304
eval_spread: true
log_every: 50
sample_every: 1200
sample_tokens: 240
save_every: 800
max_seconds: 7200
threads: 2
