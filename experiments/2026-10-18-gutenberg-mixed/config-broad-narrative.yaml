# Corpus composition, volume-matched control: 20.5 MB more narrative prose.
#
#   broad-full changes two things at once against broad-ctrl -- it trains on
#   37% more tokens and on a different mixture -- so a win there is ambiguous.
#   This arm adds the same number of bytes (20,464,929 against 20,469,186,
#   0.02% apart) of ordinary narrative prose instead of drama, verse and
#   non-fiction, which gives:
#
#     broad-ctrl       18,939,699 train tokens   90.7% narrative
#     broad-narrative  26,057,637 train tokens   ~93%  narrative
#     broad-full       25,952,894 train tokens   67.8% narrative
#
#   broad-full vs broad-narrative is composition with volume held fixed.
#   broad-narrative vs broad-ctrl is volume with composition held fixed.
#
#   All three share byte-identical val.bin, test.bin and tokenizer.json, so
#   every comparison between them is on exactly the same bytes.
run_id: broad-narrative
data_dir: data/prepared-broad-narrative
out_dir: artifacts/runs
seed: 1337

block_size: 256
n_layer: 3
n_head: 3
n_embd: 192
dropout: 0.0
tie_embeddings: true

batch_size: 16
grad_accum: 2        # 8,192 tokens per optimizer update
learning_rate: 3.0e-3
min_lr_frac: 0.1
weight_decay: 0.1
beta1: 0.9
beta2: 0.99
grad_clip: 1.0
warmup_steps: 240    # held fixed, not scaled with the horizon
max_steps: 4800      # same horizon as the data-scaling arms, for comparability

eval_every: 120      # 40 evaluations, directly comparable step-for-step
eval_tokens: 98304   # 9.4% of the 1,042,315-token val split
eval_spread: true    # spread over all 71 evaluated books, not the leading few
log_every: 50
sample_every: 1200
sample_tokens: 240
save_every: 800
max_seconds: 7200    # guard: 120 min; 151-document splits evaluate slower
threads: 2
