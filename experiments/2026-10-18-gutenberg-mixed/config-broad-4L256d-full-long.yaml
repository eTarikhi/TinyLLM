# Capacity and horizon together: the big model at the long clock.
#
#   Broadening cost +1.19% at 1.77M/4,800 steps. Doubling capacity
#   halved it (+0.62%); doubling the horizon trimmed it (+0.82%).
#   This pair asks whether the two compound: 3.74M parameters,
#   clock-matched to the 9,600-step small runs (5,173 steps at
#   ~6,600 tok/s against 9,600 at ~12,250 tok/s).
run_id: broad-4L256d-full-long
data_dir: data/prepared-broad-full
out_dir: artifacts/runs
seed: 1337

block_size: 256
n_layer: 4
n_head: 4
n_embd: 256
dropout: 0.0
tie_embeddings: true

batch_size: 16
grad_accum: 2
learning_rate: 3.0e-3
min_lr_frac: 0.1
weight_decay: 0.1
beta1: 0.9
beta2: 0.99
grad_clip: 1.0
warmup_steps: 129
max_steps: 5173

eval_every: 128
eval_tokens: 98304
eval_spread: true
log_every: 50
sample_every: 1200
sample_tokens: 240
save_every: 800
max_seconds: 9000
threads: 2
