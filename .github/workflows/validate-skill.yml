name: validate-skill

# Keeps the classes of defect that this repository has actually shipped from
# returning silently:
#   1. a SKILL.md that violates the Agent Skills frontmatter rules;
#   2. package drift (a file README advertises but that does not exist, a broken
#      relative link, a bundled resource SKILL.md never points at, or a template
#      field dropped while SKILL.md still demands it be recorded);
#   3. arithmetic drift in references/ -- the attention FLOP term was wrong by a
#      factor of d_model for two months and no checker could see it;
#   4. a broken reference implementation in scripts/tiny-gpt, which is the code
#      the skill tells an agent to copy.
#
# Versions verified 2026-10-17 against api.github.com and pypi.org.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML (the official validator imports yaml)
        run: pip install pyyaml==6.0.3

      # Pinned to an exact revision so a change upstream cannot alter what this
      # workflow enforces. Update deliberately, and re-read the spec when you do.
      - name: Fetch Anthropic's quick_validate.py at a pinned revision
        run: |
          mkdir -p .ci
          curl -fsSL -o .ci/quick_validate.py \
            "https://raw.githubusercontent.com/anthropics/skills/dbd4588f9e1033efb41dad4bef2f7947c8993d44/skills/skill-creator/scripts/quick_validate.py"

      - name: Official frontmatter validation
        run: python .ci/quick_validate.py .

      # The Agent Skills reference library. It parses the frontmatter with
      # strictyaml and -- unlike quick_validate.py -- enforces the spec rule
      # that `name` must match the parent directory name. Pinned, like
      # everything else this workflow depends on.
      - name: Install the Agent Skills reference validator
        run: pip install skills-ref==0.1.1

      - name: Repository consistency checks
        run: python .github/scripts/check_package.py .

      - name: Recompute every documented number
        run: python .github/scripts/check_docs_math.py .

      # A checkout is always named after the repository, so validating the
      # checkout directory would fail forever on the directory-name rule and
      # prove nothing. Instead, run the rename-then-package procedure the README
      # documents, then point the reference validator at the result -- the form
      # a user actually installs -- and fail if it would disagree with its own
      # frontmatter or leak files that must not ship.
      - name: Packaged identity matches the frontmatter name
        run: |
          python - <<'PY'
          import pathlib, re, shutil, subprocess, sys, tempfile
          name = re.search(r"^name:\s*(.+)$", pathlib.Path("SKILL.md").read_text().split("---")[1], re.M).group(1).strip()
          stage = pathlib.Path(tempfile.mkdtemp()) / name
          shutil.copytree(".", stage, ignore=shutil.ignore_patterns(".git", ".github", ".ci", "experiments", "data", "artifacts", "__pycache__", ".venv"))
          if stage.name != name:
              sys.exit(f"staged directory {stage.name!r} != skill name {name!r}")
          missing = [p for p in ("SKILL.md", "README.md", "LICENSE", "references", "templates", "scripts") if not (stage / p).exists()]
          if missing:
              sys.exit(f"staged copy is missing {missing}")
          leaked = [str(p.relative_to(stage)) for p in stage.rglob("*") if p.is_file() and p.relative_to(stage).parts[0] in {".git", ".github", "experiments"}]
          if leaked:
              sys.exit(f"staged copy leaked files that must not ship: {leaked[:5]}")
          # Invoke the module, not the console script: the published wheel
          # installs the entry point as `agentskills`, while the project's own
          # pyproject.toml and the specification page both say `skills-ref`.
          # `python -m` is correct either way.
          subprocess.run([sys.executable, "-m", "skills_ref.cli", "validate", str(stage)], check=True)
          print(f"staged {stage} would package as {name}.skill, contents match the frontmatter")
          PY

  reference-implementation:
    # The skill ships runnable code in scripts/tiny-gpt and tells an agent to
    # copy it. Untested code in a skill is worse than no code: it looks
    # authoritative. This job runs the Gate 1 and Gate 2 correctness tests
    # (shapes, causal masking, overfit, optimizer, generation, checkpoint,
    # resume, tokenizer) on CPU. It does not pretrain.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The CPU wheel index: the default PyPI torch wheel for Linux pulls in
      # several GB of CUDA runtime packages that a CPU runner cannot use.
      - name: Install CPU-only PyTorch and friends
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install numpy PyYAML==6.0.3 gguf==0.19.0

      - name: Unit tests (gates 1 and 2)
        working-directory: scripts/tiny-gpt
        run: python -m unittest discover -s tests -t tests -v

      - name: Smoke test the data pipeline and 20 training steps
        working-directory: scripts/tiny-gpt
        run: |
          python src/data.py --tokenizer char --out-dir data/prepared-char
          python src/train.py --config configs/tiny.yaml --run-id ci-smoke --max-steps 20 --eval-every 20 --log-every 10
